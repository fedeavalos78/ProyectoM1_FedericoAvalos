<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cromática</title>
    <link rel="stylesheet" href="../css/styles.css">
    <script src="../js/script.js" defer></script>
</head>
<body>
    <nav class="navbar">
        <div class="logo">
          <a href="../index.html"><img src="../img/logo.png" alt="Logo de Cromática" ></a>             
        </div>
        <p>Colorfly Studio</p>
        <ul class="linksnav">
            <li><a href="mis-paletas.html">Mis Paletas</a></li>
            <li><a class="gen-paleta" href="generar.html">Nueva paleta</a></li>                   
        </ul>
        
    </nav>
    <main>
        <div class="portada-gen">
            <div class="color-line">
                <div class="color">
                    <div class="c c1"></div>
                    <p>HSL</p>
                    <p>280, 70%, 10%</p>
                </div>
                <div class="color">
                    <div class="c c2"></div>
                    <p>HSL</p>
                    <p>280, 70%, 20%</p>
                </div>
                <div class="color">
                    <div class="c c3"></div>
                    <p>HSL</p>
                    <p>280, 70%, 30%</p>
                </div>
                <div class="color">
                    <div class="c c4"></div>
                    <p>HSL</p>
                    <p>280, 70%, 40%</p>
                </div>
                <div class="color">
                    <div class="c c5"></div>
                    <p>HSL</p>
                    <p>280, 70%, 50%</p>
                </div>
                <div class="color">
                    <div class="c c6"></div>
                    <p>HSL</p>
                    <p>280, 70%, 60%</p>
                </div>
                <div class="color">
                    <div class="c c7"></div>
                    <p>HSL</p>
                    <p>280, 70%, 70%</p>
                </div>
                <div class="color">
                    <div class="c c8"></div>
                    <p>HSL</p>
                    <p>280, 70%, 80%</p>
                </div>
                <div class="color">
                    <div class="c c9"></div>
                    <p>HSL</p>
                    <p>280, 70%, 90%</p>
                </div>                  
            </div>
            <div class="controles">
                <div class="selector">
                    <label for="cantidad">Cantidad de colores</label>
                    <select id="cantidad">
                        <option value="6">6</option>
                        <option value="8">8</option>
                        <option value="9" selected>9</option>
                    </select>
                </div>
                <div class="formato-color">
                        <label for="for-c">Formato</label>
                        <select id="for-c">
                            <option value="8">HEX</option>
                            <option value="9" selected>HSL</option>
                        </select>
                </div>
                <button class="btn gen-paleta">Generar paleta</button>
            </div>
        </div>
    </main> 
    <footer class="footer">
        <p>&copy; 2026 Cromática. Todos los derechos reservados.</p>    
</body>
</html>
